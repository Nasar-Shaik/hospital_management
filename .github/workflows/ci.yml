# CI (Doc 04 §7): lint & typecheck → tests → build → boundaries, cached by turbo.
# Security scans (Trivy/CodeQL/gitleaks) and e2e stages are added in P9 per the
# pipeline spec; Sprint 0 ships the correctness gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Real MongoDB for the tenant-isolation suite. `mongodb-replica-set` style
      # single-node RS gives us transactions; the isolation tests connect with
      # directConnection=true so no topology discovery is involved.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Real Redis for the auth suite's access-token blocklist. Without it the
      # blocklist assertions would pass vacuously — cache helpers fail soft, so a
      # missing Redis makes "revoked" and "never revoked" look identical.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Release-gating (Doc 05 §4.2, RISK_REGISTER T1). Runs against a real MongoDB
      # and a real Redis — these suites fail, never skip, if the infrastructure is
      # unreachable: a silently skipped isolation suite is indistinguishable from a
      # passing one.
      - name: Integration tests (tenant isolation + authentication)
        run: pnpm --filter @medicore/api test:int
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          REDIS_TEST_URL: redis://127.0.0.1:6379

      - name: Build
        run: pnpm build

      - name: Module boundaries
        run: pnpm boundaries

      - name: Commitlint (PR title convention)
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | pnpm commitlint
