# CI (Doc 04 §7): lint & typecheck → tests → build → boundaries, cached by turbo.
# Security scans (Trivy/CodeQL/gitleaks) and e2e stages are added in P9 per the
# pipeline spec; Sprint 0 ships the correctness gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Module boundaries
        run: pnpm boundaries

      - name: Commitlint (PR title convention)
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | pnpm commitlint
