# Dev environment (Doc 04 §6.1).
# Default profile: infrastructure only (apps run on host with hot reload).
# `--profile apps` additionally builds and runs the four app containers.
name: medicore-hms

services:
  mongo:
    image: mongo:7
    # ── WHY MONGOD RUNS ON 27018 *INSIDE* THE CONTAINER TOO ──────────────────────
    # Not cosmetic. A replica-set client does not talk to the server you named: it
    # asks that server who the members are, then connects to THOSE addresses. So
    # whatever we put in the RS config is an address the *client* must be able to
    # resolve — and the client is usually on the host, not in this network.
    #
    # With mongod on 27017 internally, the honest RS config is `localhost:27017`,
    # which from the host means "port 27017 on my Mac" — i.e. WHATEVER ELSE THE
    # DEVELOPER IS RUNNING. Replica sets are conventionally all named `rs0`, so the
    # driver cannot tell it has crossed into another project's database; it thinks
    # it found the primary. That is a silent cross-project write, not an error.
    #
    # Running mongod on 27018 and publishing 27018:27018 makes ONE address true
    # from both sides: `localhost:27018` is this server from the host, and this
    # server from inside the container. Discovery becomes self-consistent, so a
    # client that forgets `directConnection=true` still lands here — safe by
    # construction rather than safe by remembering a query parameter.
    command: ["mongod", "--replSet", "rs0", "--port", "27018", "--bind_ip_all"]
    ports:
      # Host 27018, not 27017: another project on this machine already binds the
      # default. Both sides must stay equal — see above. Overriding MONGO_PORT
      # breaks that equality, and then only `directConnection=true` saves you.
      - "${MONGO_PORT:-27018}:27018"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the single-node replica set on first check (transactions and
      # change streams need one). SELF-HEALING: an existing volume from before the
      # port change still carries `localhost:27017` in its RS config, which would
      # keep pointing clients at the wrong server forever. If the advertised host
      # is not what we require, force-reconfigure it. Idempotent, and it costs one
      # comparison per health check.
      test: |
        mongosh --quiet --port 27018 --eval "
          const want = 'localhost:27018';
          try {
            const c = rs.conf();
            if (c.members[0].host !== want) { c.members[0].host = want; c.version++; rs.reconfig(c, {force: true}); }
            rs.status().ok;
          } catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:want}]}).ok;
          }"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host 6380, not 6379 — same reason as mongo above. Override with REDIS_PORT.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

  api:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      # Inside a container, 127.0.0.1 is reachable only from the container itself,
      # so the production default would make the API unreachable. Docker's network
      # provides the isolation here instead of the bind address.
      API_BIND: 0.0.0.0
      # Port 27018 inside the network too — mongod listens there now (see the mongo
      # service). `directConnection=true` is still required: from THIS container,
      # the advertised `localhost:27018` would mean the api container itself.
      MONGO_URI: mongodb://mongo:27018/?directConnection=true
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # Local-compose secrets only. Real environments inject these from the secret
      # store — never from a committed file (Doc 09 §20).
      API_JWT_SECRET: ${API_JWT_SECRET:-local-compose-jwt-secret-not-for-any-real-environment}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:-bG9jYWwtY29tcG9zZS1lbmMta2V5LTMyLWJ5dGVzISE=}
      # Notifications (A6). `mailhog` is the service name on the compose network —
      # from INSIDE a container, `localhost` would mean the api container itself.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      HEALTH_PORT: 4100
    ports:
      - "4100:4100"
    depends_on:
      redis:
        condition: service_healthy

  web:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
  minio-data:
